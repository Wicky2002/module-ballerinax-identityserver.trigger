  consent:
    address: /
    description: Events in the consent category.
    messages:
      consentAdded:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/consent/event-type/consentAdded
        x-ballerina-event-label: ConsentAdded
        summary: Consent added.
        payload:
          $ref: '#/components/schemas/ConsentAddedEvent'
      consentRevoked:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/consent/event-type/consentRevoked
        x-ballerina-event-label: ConsentRevoked
        summary: Consent revoked.
        payload:
          $ref: '#/components/schemas/ConsentRevokedEvent'
    bindings:
      http:
        method: POST
  consentPurpose:
    address: /
    description: Events in the consent-purpose category.
    messages:
      purposeVersionAdded:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/consent-purpose/event-type/purposeVersionAdded
        x-ballerina-event-label: PurposeVersionAdded
        summary: Purpose version added.
