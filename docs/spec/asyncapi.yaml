        payload:
          $ref: '#/components/schemas/RoleMetaUpdatedEvent'
      roleDeleted:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/roleDeleted
        x-ballerina-event-label: RoleDeleted
        summary: Role deleted.
        payload:
          $ref: '#/components/schemas/RoleDeletedEvent'
      roleUsersUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/roleUsersUpdated
        x-ballerina-event-label: RoleUsersUpdated
        summary: Role users updated.
        payload:
          $ref: '#/components/schemas/RoleUsersUpdatedEvent'
      roleGroupsUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/roleGroupsUpdated
        x-ballerina-event-label: RoleGroupsUpdated
        summary: Role groups updated.
        payload:
          $ref: '#/components/schemas/RoleGroupsUpdatedEvent'
      roleIdpGroupsUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/roleIdpGroupsUpdated
        x-ballerina-event-label: RoleIdpGroupsUpdated
        summary: Role IdP groups updated.
        payload:
          $ref: '#/components/schemas/RoleIdpGroupsUpdatedEvent'
      rolePermissionsUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/rolePermissionsUpdated
        x-ballerina-event-label: RolePermissionsUpdated
