asyncapi: 3.0.0
# The event is identified by the single key inside `events` (a URI), not by a field value.
x-ballerina-event-identifier:
  type: body-key
  path: events
# Deliveries are signed with `sha256=<hex>`, an HMAC-SHA256 of the raw body keyed with the webhook secret. WSO2
# Identity Server sends it in `x-wso2-event-signature` and Asgardeo in `x-hub-signature`; the listener takes either.
x-ballerina-auth:
  header: x-wso2-event-signature
  signature:
    algorithm: sha256
    encoding: hex
    headerFormat: "sha256=$signature"
    input: "$body"
info:
  title: WSO2 Identity Server Webhooks
  version: 1.0.0
  description: >-
    Webhook events emitted by WSO2 Identity Server 7.2 and later, and by Asgardeo. Each delivery is a Security Event
    Token (RFC 8417) claim set sent as JSON over HTTP POST, with one event per delivery under `events`. Subscriptions are
    verified with a WebSub GET handshake (`hub.challenge`) when a webhook is activated or deactivated. On Identity
    Server, role, consent, consent-purpose and organization events need version 7.4 or later.
  externalDocs:
    description: Webhook events and payloads
    url: https://is.docs.wso2.com/en/next/guides/webhooks/webhook-events-and-payloads/
defaultContentType: application/json
channels:
  login:
    address: /
    description: Events in the login category.
    messages:
      loginSuccess:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/login/event-type/loginSuccess
        x-ballerina-event-label: LoginSuccess
        summary: Login success.
        payload:
          $ref: '#/components/schemas/LoginSuccessEvent'
      loginFailed:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/login/event-type/loginFailed
        x-ballerina-event-label: LoginFailed
        summary: Login failed.
        payload:
          $ref: '#/components/schemas/LoginFailedEvent'
    bindings:
      http:
        method: POST
