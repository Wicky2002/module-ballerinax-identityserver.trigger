  subscriptionVerification:
    address: /
    description: >-
      The WebSub verification of intent Identity Server sends when a webhook is activated or deactivated, once per
      subscribed event type. The listener answers it by echoing `hub.challenge`.
    messages:
      verificationReply:
        summary: The `hub.challenge` value, returned as plain text.
        payload:
          type: string
        bindings:
          http:
            statusCode: 200
operations:
  login:
    action: receive
    channel:
      $ref: '#/channels/login'
    messages:
      - $ref: '#/channels/login/messages/loginSuccess'
      - $ref: '#/channels/login/messages/loginFailed'
  registration:
    action: receive
    channel:
      $ref: '#/channels/registration'
    messages:
      - $ref: '#/channels/registration/messages/registrationSuccess'
      - $ref: '#/channels/registration/messages/registrationFailed'
  token:
    action: receive
    channel:
      $ref: '#/channels/token'
    messages:
      - $ref: '#/channels/token/messages/accessTokenIssued'
      - $ref: '#/channels/token/messages/accessTokenRevoked'
  session:
    action: receive
    channel:
      $ref: '#/channels/session'
    messages:
      - $ref: '#/channels/session/messages/sessionEstablished'
      - $ref: '#/channels/session/messages/sessionPresented'
      - $ref: '#/channels/session/messages/sessionRevoked'
  credential:
    action: receive
    channel:
      $ref: '#/channels/credential'
    messages:
      - $ref: '#/channels/credential/messages/credentialUpdated'
  user:
    action: receive
    channel:
      $ref: '#/channels/user'
    messages:
      - $ref: '#/channels/user/messages/userCreated'
      - $ref: '#/channels/user/messages/userProfileUpdated'
      - $ref: '#/channels/user/messages/userDisabled'
      - $ref: '#/channels/user/messages/userEnabled'
      - $ref: '#/channels/user/messages/userAccountLocked'
      - $ref: '#/channels/user/messages/userAccountUnlocked'
      - $ref: '#/channels/user/messages/userDeleted'
  consent:
    action: receive
    channel:
      $ref: '#/channels/consent'
    messages:
      - $ref: '#/channels/consent/messages/consentAdded'
      - $ref: '#/channels/consent/messages/consentRevoked'
  consentPurpose:
    action: receive
    channel:
      $ref: '#/channels/consentPurpose'
    messages:
      - $ref: '#/channels/consentPurpose/messages/purposeVersionAdded'
  role:
    action: receive
    channel:
      $ref: '#/channels/role'
    messages:
      - $ref: '#/channels/role/messages/roleCreated'
      - $ref: '#/channels/role/messages/roleMetaUpdated'
      - $ref: '#/channels/role/messages/roleDeleted'
      - $ref: '#/channels/role/messages/roleUsersUpdated'
      - $ref: '#/channels/role/messages/roleGroupsUpdated'
      - $ref: '#/channels/role/messages/roleIdpGroupsUpdated'
      - $ref: '#/channels/role/messages/rolePermissionsUpdated'
  organization:
    action: receive
    channel:
      $ref: '#/channels/organization'
    messages:
      - $ref: '#/channels/organization/messages/organizationCreated'
      - $ref: '#/channels/organization/messages/organizationUpdated'
      - $ref: '#/channels/organization/messages/organizationEnabled'
      - $ref: '#/channels/organization/messages/organizationDisabled'
      - $ref: '#/channels/organization/messages/organizationDeleted'
  verifyIntent:
    action: receive
    summary: WebSub verification of intent (https://www.w3.org/TR/websub/#hub-verifies-intent).
    channel:
      $ref: '#/channels/subscriptionVerification'
    bindings:
      http:
        method: GET
        query:
          type: object
          required:
            - hub.mode
            - hub.topic
            - hub.challenge
          properties:
            hub.mode:
              type: string
              description: subscribe when the webhook is activated, unsubscribe when it is deactivated.
              enum:
                - subscribe
                - unsubscribe
            hub.topic:
              type: string
              description: The topic of one subscribed event type.
            hub.challenge:
              type: string
              description: A random string the endpoint must return to confirm.
            hub.lease_seconds:
              type: integer
              description: How long the subscription stays active, in seconds.
    reply:
      channel:
        $ref: '#/channels/subscriptionVerification'
      messages:
        - $ref: '#/channels/subscriptionVerification/messages/verificationReply'
components:
  schemas:
    InitiatorType:
      type: string
      description: Indicates the persona who initiates the identity flow.
    Action:
      type: string
      description: Indicates the related identity flow.
    InitiatorIpAddress:
      type: string
      description: Indicates the IP address of the initiator that triggered the event.
      example: 203.0.113.10
    Claim:
      type: object
      required:
        - uri
        - value
      properties:
        uri:
          type: string
          description: Local claim uri name. E.g., http://wso2.org/claims/username
          example: http://wso2.org/claims/username
        value:
          description: Claim value. Either a single value or an array of values for multi-valued claims.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          example: peter@aol.com
    User:
      type: object
      description: Information of the user interacting in the related event.
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: d4002616-f00c-49d5-b9b7-63b063819049
        claims:
          type: array
          description: Claim values of the user.
          items:
            $ref: '#/components/schemas/Claim'
        organization:
          description: The organization the user belongs to (the user's resident organization).
          allOf:
            - $ref: '#/components/schemas/Organization'
        ref:
          type: string
          description: SCIM 2.0 resource URL for the user.
    ProfileUpdatedUser:
      description: Contains information about the user whose profile updated.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: d4002616-f00c-49d5-b9b7-63b063819049
        organization:
          description: The organization the user belongs to (the user's resident organization).
          allOf:
            - $ref: '#/components/schemas/Organization'
        addedClaims:
          type: array
          description: Claims added to the user's profile during the update.
          items:
            $ref: '#/components/schemas/Claim'
        updatedClaims:
          type: array
          description: Claims whose values changed during the update.
          items:
            $ref: '#/components/schemas/Claim'
        removedClaims:
          type: array
          description: Claims removed from the user's profile during the update.
          items:
            type: object
            properties:
              uri:
                type: string
                description: Local claim uri name. E.g., http://wso2.org/claims/username
                example: http://wso2.org/claims/username
        ref:
          type: string
          description: SCIM 2.0 resource URL for the user.
    Tenant:
      type: object
      description: Root organization (tenant).
      properties:
        id:
          type: string
          description: The unique numeric identifier of the tenant.
          example: '12402'
        name:
          type: string
          description: The domain name of the tenant.
          example: myorg
    Organization:
      type: object
      description: The organization under which the event is processed.
      properties:
        id:
          type: string
          description: Unique identifier of the organization.
          example: 6f8d17ae-1ad5-441b-b9e0-c7731e739e94
        name:
          type: string
          description: Name of the organization.
          example: myorg
        orgHandle:
          type: string
          description: Unique, human-readable handle of the organization.
          example: myorg
        depth:
          type: integer
          description: The depth of the organization in the hierarchy.
          example: 0
    UserStore:
      type: object
      description: User store managing the user's data.
      properties:
        id:
          type: string
          description: The unique identifier for the user store.
          example: UFJJTUFSWQ==
        name:
          type: string
          description: >-
            User store name used to identify the user store in configuration settings, user interfaces, and
            administrative tasks.
          example: PRIMARY
    Application:
      type: object
      description: Information about an application.
      properties:
        id:
          type: string
          description: Unique identifier of the application.
          example: 40d982e5-23be-4ee1-8540-9cb696d8c321
        name:
          type: string
          description: Name of the application.
          example: MyApp
    Session:
      type: object
      description: Information about the session.
      properties:
        id:
          type: string
          description: Unique identifier for the session
          example: 68d1f2861461c69d8e821d91839bbf8e23ef04fb96c1ac655f452d94d1fd6e4d
        loginTime:
          type: integer
          description: Timestamp when the session originally started.
          example: 1755541960025
        applications:
          type: array
          description: Array of applications associated with this session.
          items:
            $ref: '#/components/schemas/Application'
    AccessToken:
      type: object
      description: Details about the issued token.
      properties:
        tokenType:
          type: string
          description: e.g. `Opaque` or `jwt`.
          example: Opaque
        iat:
          type: string
          description: Token issued at timestamp.
          example: '1755541962069'
        grantType:
          type: string
          description: OAuth2 grant type used for token issuance (e.g., `authorization_code`)
          example: authorization_code
    Reason:
      type: object
      description: Context information for the failure.
      properties:
        description:
          type: string
          description: Human-readable explanation of the failure.
          example: User authentication failed due to invalid credentials
        context:
          type: object
          description: Details about the failure point in the related identity flow.
          properties:
            failedStep:
              type: object
              description: Details about the failure step in the authentication flow.
              properties:
                step:
                  type: integer
                  example: 1
                  description: Step number where the failure occurred
                idp:
                  type: string
                  example: LOCAL
                  description: Identity Provider (IdP) involved in the failure
                authenticator:
                  type: string
                  example: BasicAuthenticator
                  description: Authenticator used.
    Consent:
      type: object
      description: Contains details about the consent.
      properties:
        id:
          type: string
          description: Unique identifier for the consent record.
          example: 501a6ba7-0b15-4ae6-9642-03b5267ab996
        subjectId:
          type: string
          description: Username of the user to whom the consent applies.
          example: peter
        state:
          type: string
          description: Current state of the consent.
          example: APPROVED
        serviceId:
          type: string
          description: The service or application for which the consent is granted.
          example: Resident IDP
        purpose:
          type: object
          description: Details of the consent purpose.
          properties:
            id:
              type: string
              description: Unique identifier of the consent purpose.
              example: 909eea3e-5bf1-4106-a5b8-44580fc4ae74
            name:
              type: string
              description: Human-readable name of the consent purpose.
              example: Marketing Consent
            version:
              type: string
              description: The UUID of the specific purpose version the user consented to.
              example: 12a53d28-4536-4201-939e-5e5c00eadf7b
            elements:
              type: array
              description: Array of PII categories covered by the consent, each with a name.
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Policy
    PurposeVersion:
      type: object
      description: Contains details about the updated consent purpose.
      properties:
        id:
          type: string
          description: Unique identifier for the consent purpose.
          example: 909eea3e-5bf1-4106-a5b8-44580fc4ae74
        name:
          type: string
          description: Human-readable name of the consent purpose.
          example: Marketing Consent
        version:
          type: object
          description: Details of the newly added version.
          properties:
            version:
              type: string
              description: The version number of the new version.
              example: '2'
            setAsLatest:
              type: boolean
              description: Whether this version becomes the active version for new consents.
              example: true
            elements:
              type: array
              description: Array of attributes (elements) included in this version, each with a name and mandatory flag.
              items:
                type: object
                properties:
                  name:
                    type: string
                    example: Policy
                  mandatory:
                    type: boolean
                    example: false
    EventData_LoginSuccess:
      title: Login success
      type: object
      required:
        - https://schemas.identity.wso2.org/events/login/event-type/loginSuccess
      properties:
        https://schemas.identity.wso2.org/events/login/event-type/loginSuccess:
          $ref: '#/components/schemas/LoginSuccessPayload'
    EventData_LoginFailed:
      title: Login failed
      type: object
      required:
        - https://schemas.identity.wso2.org/events/login/event-type/loginFailed
      properties:
        https://schemas.identity.wso2.org/events/login/event-type/loginFailed:
          $ref: '#/components/schemas/LoginFailedPayload'
    EventData_RegistrationSuccess:
      title: Registration success
      type: object
      required:
        - https://schemas.identity.wso2.org/events/registration/event-type/registrationSuccess
      properties:
        https://schemas.identity.wso2.org/events/registration/event-type/registrationSuccess:
          $ref: '#/components/schemas/RegistrationSuccessPayload'
    EventData_RegistrationFailed:
      title: Registration failed
      type: object
      required:
        - https://schemas.identity.wso2.org/events/registration/event-type/registrationFailed
      properties:
        https://schemas.identity.wso2.org/events/registration/event-type/registrationFailed:
          $ref: '#/components/schemas/RegistrationFailedPayload'
    EventData_AccessTokenIssued:
      title: Access token issued
      type: object
      required:
        - https://schemas.identity.wso2.org/events/token/event-type/accessTokenIssued
      properties:
