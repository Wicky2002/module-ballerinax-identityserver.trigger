  role:
    address: /
    description: Events in the role category.
    messages:
      roleCreated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/roleCreated
        x-ballerina-event-label: RoleCreated
        summary: Role created.
        payload:
          $ref: '#/components/schemas/RoleCreatedEvent'
      roleMetaUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/role/event-type/roleMetaUpdated
        x-ballerina-event-label: RoleMetaUpdated
