        method: POST
  organization:
    address: /
    description: Events in the organization category.
    messages:
      organizationCreated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/organization/event-type/organizationCreated
        x-ballerina-event-label: OrganizationCreated
        summary: Organization created.
        payload:
          $ref: '#/components/schemas/OrganizationCreatedEvent'
      organizationUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/organization/event-type/organizationUpdated
        x-ballerina-event-label: OrganizationUpdated
        summary: Organization updated.
        payload:
          $ref: '#/components/schemas/OrganizationUpdatedEvent'
      organizationEnabled:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/organization/event-type/organizationEnabled
        x-ballerina-event-label: OrganizationEnabled
        summary: Organization enabled.
        payload:
          $ref: '#/components/schemas/OrganizationEnabledEvent'
      organizationDisabled:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/organization/event-type/organizationDisabled
