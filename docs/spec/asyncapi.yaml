      sessionRevoked:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/session/event-type/sessionRevoked
        x-ballerina-event-label: SessionRevoked
        summary: Session revoked.
        payload:
          $ref: '#/components/schemas/SessionRevokedEvent'
    bindings:
      http:
        method: POST
  credential:
    address: /
    description: Events in the credential category.
    messages:
      credentialUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/credential/event-type/credentialUpdated
        x-ballerina-event-label: CredentialUpdated
        summary: Credential updated.
        payload:
          $ref: '#/components/schemas/CredentialUpdatedEvent'
    bindings:
      http:
        method: POST
  user:
    address: /
    description: Events in the user category.
    messages:
      userCreated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/user/event-type/userCreated
        x-ballerina-event-label: UserCreated
        summary: User created.
        payload:
          $ref: '#/components/schemas/UserCreatedEvent'
      userProfileUpdated:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/user/event-type/userProfileUpdated
        x-ballerina-event-label: UserProfileUpdated
        summary: User profile updated.
        payload:
          $ref: '#/components/schemas/UserProfileUpdatedEvent'
      userDisabled:
        x-ballerina-event-type: https://schemas.identity.wso2.org/events/user/event-type/userDisabled
        x-ballerina-event-label: UserDisabled
